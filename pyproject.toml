[project]
name = "ad-performance-aggregator"
version = "1.0.0"
description = "High-performance advertising performance data aggregator for FV-SEC001"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
